<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Sotuv Trenajyori analitikasi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{--ink:#0E1420;--ink-2:#151E2E;--card:#FFFFFF;--paper:#EAEDF2;--cyan:#00AFEF;--gold:#FFBA37;--red:#FF4D4D;--green:#2FBF71;--txt:#0E1420;--dim:#5B6675;--line:rgba(148,163,184,.22);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--paper);color:var(--txt);line-height:1.5;}
.mono{font-family:'IBM Plex Mono',monospace;}
.top{background:var(--ink);color:#E6ECF5;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.top .l{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.1em;font-size:14px;}
.dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(47,191,113,.18);}
.wrap{max-width:1000px;margin:0 auto;padding:24px 22px 60px;}

.login{max-width:380px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;}
.login h1{font-size:20px;margin-bottom:6px;}
.login p{color:var(--dim);font-size:14px;margin-bottom:18px;}
input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;margin-bottom:12px;}
input:focus{outline:none;border-color:var(--cyan);}
.btn{width:100%;background:var(--cyan);color:#04121b;border:0;padding:13px;border-radius:10px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer;}
.btn:hover{filter:brightness(1.05);}
.err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:18px;}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;}
.kpi .n{font-family:'IBM Plex Mono',monospace;font-size:32px;font-weight:600;color:var(--ink);}
.kpi .t{font-size:13px;color:var(--dim);margin-top:4px;letter-spacing:.04em;text-transform:uppercase;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;}
.panel h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:14px;}
.bar{margin-bottom:10px;}
.bar .lab{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px;}
.bar .lab b{font-family:'IBM Plex Mono',monospace;}
.bar .track{background:var(--paper);border-radius:6px;height:9px;overflow:hidden;}
.bar .fill{height:100%;background:var(--cyan);border-radius:6px;}
.bar.g .fill{background:var(--gold);} .bar.r .fill{background:var(--red);} .bar.gr .fill{background:var(--green);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
th{color:var(--dim);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
td.mono{font-family:'IBM Plex Mono',monospace;color:var(--dim);}
.refresh{background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:8px 14px;border-radius:9px;font-family:inherit;font-size:13px;cursor:pointer;}
.empty{color:var(--dim);text-align:center;padding:30px;font-size:14px;}
@media(max-width:820px){.cards,.grid2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="top">
  <div class="l"><span class="dot"></span> TRENAJYOR · ADMIN</div>
  <button class="refresh" id="refreshBtn" style="display:none" onclick="yukla()">↻ Yangilash</button>
</div>

<div id="loginBox" class="login">
  <h1>Admin panel</h1>
  <p>Statistikани ko'rish uchun parolni kiriting</p>
  <input type="password" id="parol" placeholder="Parol" onkeydown="if(event.key==='Enter')kir()" />
  <button class="btn" onclick="kir()">Kirish</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="dash" class="wrap" style="display:none"></div>

<script>
var PAROL = "";

function kir(){
  PAROL = document.getElementById('parol').value.trim();
  if(!PAROL){ document.getElementById('loginErr').textContent = "Parol kiriting"; return; }
  yukla(true);
}

async function yukla(fromLogin){
  try{
    var r = await fetch('/api/admin?parol=' + encodeURIComponent(PAROL));
    var d = await r.json();
    if(!r.ok){ 
      if(fromLogin) document.getElementById('loginErr').textContent = d.error || 'Xato';
      else alert(d.error || 'Xato');
      return;
    }
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    document.getElementById('refreshBtn').style.display = 'inline-block';
    render(d);
  }catch(e){
    document.getElementById('loginErr').textContent = "Ulanishда xato";
  }
}

function barlar(obj, klass){
  var keys = Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];});
  if(!keys.length) return '<div class="empty">Hali ma\'lumot yo\'q</div>';
  var max = obj[keys[0]] || 1;
  return keys.map(function(k){
    var w = Math.round((obj[k]/max)*100);
    return '<div class="bar '+(klass||'')+'"><div class="lab"><span>'+esc(k)+'</span><b>'+obj[k]+'</b></div>'+
           '<div class="track"><div class="fill" style="width:'+w+'%"></div></div></div>';
  }).join('');
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function render(d){
  var oxirgi = (d.oxirgi||[]).map(function(e){
    var vaqt = new Date(e.t).toLocaleString('ru-RU');
    var joy = [e.shahar, e.davlat].filter(Boolean).join(', ') || '—';
    return '<tr><td class="mono">'+vaqt+'</td><td>'+esc(e.nisha||'—')+'</td><td>'+esc(e.segment||'—')+'</td><td>'+esc(e.rejim||'—')+'</td><td>'+esc(joy)+'</td></tr>';
  }).join('');

  document.getElementById('dash').innerHTML =
    '<div class="cards">'+
      '<div class="kpi"><div class="n">'+(d.jami||0)+'</div><div class="t">Jami suhbat</div></div>'+
      '<div class="kpi"><div class="n">'+(d.sessiyalar||0)+'</div><div class="t">Alohida foydalanuvchi</div></div>'+
      '<div class="kpi"><div class="n">'+Object.keys(d.byNisha||{}).length+'</div><div class="t">Faol nisha</div></div>'+
    '</div>'+
    '<div class="grid2">'+
      '<div class="panel"><h3>Nisha bo\'yicha (nima ko\'p so\'ralyapti)</h3>'+barlar(d.byNisha||{})+'</div>'+
      '<div class="panel"><h3>Segment (B2B / B2C / B2G)</h3>'+barlar(d.bySegment||{},'g')+'</div>'+
    '</div>'+
    '<div class="grid2">'+
      '<div class="panel"><h3>Davlat / shahar (qayerdan kirishyapti)</h3>'+barlar(d.byDavlat||{},'gr')+'</div>'+
      '<div class="panel"><h3>Rejim</h3>'+barlar(d.byRejim||{},'r')+'</div>'+
    '</div>'+
    '<div class="panel"><h3>Oxirgi suhbatlar</h3>'+
      (oxirgi ? '<table><thead><tr><th>Vaqt</th><th>Nisha</th><th>Segment</th><th>Rejim</th><th>Joy</th></tr></thead><tbody>'+oxirgi+'</tbody></table>' : '<div class="empty">Hali ma\'lumot yo\'q</div>')+
    '</div>';
}
</script>
</body>
</html>
