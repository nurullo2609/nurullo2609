[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Funksiyalar Node 20 da ishlashi shart — global fetch shu versiyada bor.
# NODE_VERSION build uchun, AWS_LAMBDA_JS_RUNTIME esa funksiya ish vaqti uchun.
[build.environment]
  NODE_VERSION = "20"
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

# Frontend "/api/claude" -> serverless funksiya
[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200

# SPA fallback (barcha yo'llar index.html ga)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
